<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SideShift</title>
    <script>
      // 首帧前应用主题，避免深色模式闪白（与 src/lib/theme.ts 的 localStorage("theme") 约定一致）
      // 默认值两处要一样：没存过 = system，跟随系统而非预设深色
      (function () {
        var t = localStorage.getItem("theme") || "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <style>
      /* ================= 启动页「体素」（参数来自 .scratch/splash-proto.html 的导出配置）
       *
       * 为什么内联在这里：主包 ~632KB 执行完才有 App.css / Tailwind，而启动页必须赶上
       * HTML 首帧。所以下面不引用任何令牌，颜色是 src/App.css 的字面量副本
       * （改 App.css 的 --bg-app / --rail-track / --accent 时同步这里，两处口径）：
       *   亮 #f5f6f8 #dfe2e8 #4f5de5 ／ 暗 #121317 #2a2d36 #8b95ff
       *
       * 图形只用 public/logo.svg 的切片，不画第二份几何（全应用图形单源）：
       * viewBox 已裁到图形本身，所以背景尺寸=方块尺寸时是 1:1 映射，
       * 方块高等分四条、每条往上挪 1/4 就是四条 chunk。
       *
       * 收场由 src/lib/splash.ts 挂 .sp-out，React 首屏画完两帧后触发。 */
      #splash {
        --sp-size: 64px;
        --sp-in: 900ms;
        --sp-ease: cubic-bezier(0.4, 0, 0.2, 1);
        --sp-stag: 80ms;
        --sp-loop: 1600ms;
        position: fixed;
        /* 与卡片刻意同尺寸：窗口是透明的，四周那圈留白（App.css 的 --win-inset）必须露出来，
         * 否则启动页会把整窗涂实、投影无处可显。inset 与那道阴影都是 App.css / App.tsx
         * 的字面量副本——改 --win-inset 或 --win-shadow 时同步这里（沿用上面颜色的同步规矩）。
         * 阴影两档主题共用一条，和 App.css 一样只在基础规则里写一次。
         * 阴影在启动页也要画，不然 React 挂载那一刻投影会凭空跳出来。 */
        inset: 6px;
        /* 圆角同样是 App.css 的字面量副本（`--win-radius: 8px`，`.app-shell` 那一档）：
         * 少了这一条，启动页是一枚直角方块，React 挂载那一刻四角才当场收圆。
         * 最大化时 App.css 把令牌写成 0，这里跟着一起改才会露圆边——启动页只在冷启动那一趟出现，
         * 那一趟窗口不会是最大化态（`--win-inset` 的 6px 副本同理），故不镜像 `[data-win-max]`。 */
        border-radius: 8px;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(15, 18, 26, 0.22);
        background: #f5f6f8;
      }
      .dark #splash {
        background: #121317;
      }
      .sp-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .sp-mark {
        position: relative;
        width: var(--sp-size);
        height: var(--sp-size);
        /* 四条叠完之后整块轻轻起伏，读作「还在装」 */
        animation: sp-idle var(--sp-loop) cubic-bezier(0.45, 0, 0.55, 1)
          calc(240ms + var(--sp-in) + var(--sp-stag) * 3) infinite both;
      }
      @keyframes sp-idle {
        0%,
        100% {
          transform: none;
        }
        50% {
          transform: translateY(-3px);
        }
      }
      .sp-b {
        position: absolute;
        left: 0;
        width: var(--sp-size);
        /* +1px 是拼接缝的旋钮：整页按显示器缩放比栅格化时，图块的切割边会落在半像素上，
           那条边于是按「图块 vs 启动页底色」做抗锯齿 ⇒ 拼回去是一道背景色的头发丝。
           向下多画 1px 让上一条图块垫在下面（背景图仍是同一张 64px、位置对齐 ⇒ 重叠区是同一批像素，
           不会画错内容），下一块的软边就变成「图块 vs 图块」混合，缝当场没了。
           最下面那块多出的 1px 落在图形之外（no-repeat ⇒ 不画任何东西），无副作用。
           若你看到的不是头发丝而是更宽的缝，把这里的 1px 加大即可。 */
        height: calc(var(--sp-size) / 4 + 1px);
        background-image: url("/logo.svg");
        background-repeat: no-repeat;
        background-size: var(--sp-size) var(--sp-size);
        will-change: transform, opacity;
        /* 下截先落，四条全往同一边错 18px（样片 alt_offset=off） */
        animation: sp-drop var(--sp-in) var(--sp-ease) both;
      }
      .sp-b1 {
        top: 0;
        background-position: 0 0;
        animation-delay: calc(240ms + var(--sp-stag) * 3);
      }
      .sp-b2 {
        top: calc(var(--sp-size) / 4);
        background-position: 0 calc(var(--sp-size) * -1 / 4);
        animation-delay: calc(240ms + var(--sp-stag) * 2);
      }
      .sp-b3 {
        top: calc(var(--sp-size) / 2);
        background-position: 0 calc(var(--sp-size) * -1 / 2);
        animation-delay: calc(240ms + var(--sp-stag));
      }
      .sp-b4 {
        top: calc(var(--sp-size) * 3 / 4);
        background-position: 0 calc(var(--sp-size) * -3 / 4);
        animation-delay: 240ms;
      }
      @keyframes sp-drop {
        0% {
          opacity: 0;
          /* 从上方 40px 落下、缩到 0.88，落定才放大归位 */
          transform: translate(18px, -40px) scale(0.88);
        }
        55% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }
      .sp-prog {
        position: relative;
        width: 132px;
        height: 6px;
        /* 轨道与里面的光带同一个圆角口径（999px = 6px 高的胶囊）；1px 时看着仍是直角 */
        border-radius: 999px;
        overflow: hidden;
        /* 轨道色借 Shift Rail 的「未达段」（App.css 的 --rail-track：亮 #dfe2e8 / 暗 #2a2d36）。
         * 原来借 --surface-2 的 #eef0f3：压在 #f5f6f8 上实测只差 6/255，轨道等于看不见，
         * 整条进度只剩一坨游移的蓝；#dfe2e8 是 21/255。内阴影给它一点凹槽的深度感。 */
        background: #dfe2e8;
        box-shadow: inset 0 1px 1px rgba(15, 18, 26, 0.07);
      }
      .dark #splash .sp-prog {
        background: #2a2d36;
        box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.35);
      }
      /* 一条光带被槽裁住：出右沿的那一刻就是入左沿的那一刻。
         行程 -100%→263.158%（百分比按自身宽度算：100% + 槽宽/带宽×100% = 100 + 100/0.38）
         = 槽宽 + 一条带宽 ⇒ 换圈处没有跳变；linear ⇒ 不在首尾减速。
         带子里 46%–76% 是一段实心 ⇒ 读得出"有一根东西在走"，两端渐隐只给方向；
         原来 30% 宽的全对称渐变，真正染到色的只有中间那一两列像素。 */
      .sp-prog i {
        position: absolute;
        left: 0;
        top: 0;
        width: 38%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #4f5de5 46%,
          #4f5de5 76%,
          transparent 100%
        );
        animation: sp-run var(--sp-loop) linear infinite;
      }
      .dark #splash .sp-prog i {
        background: linear-gradient(
          90deg,
          transparent 0%,
          #8b95ff 46%,
          #8b95ff 76%,
          transparent 100%
        );
      }
      @keyframes sp-run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(263.158%);
        }
      }
      /* 退场：两段共 60ms，先让内容上移淡掉、再抽掉整张底 */
      #splash.sp-out {
        animation: sp-fade 27ms ease 33ms both;
      }
      #splash.sp-out .sp-wrap {
        animation: sp-rise 33ms ease both;
      }
      @keyframes sp-rise {
        to {
          opacity: 0;
          transform: translateY(-10px) scale(0.97);
        }
      }
      @keyframes sp-fade {
        to {
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-wrap">
        <div class="sp-mark">
          <i class="sp-b sp-b1"></i>
          <i class="sp-b sp-b2"></i>
          <i class="sp-b sp-b3"></i>
          <i class="sp-b sp-b4"></i>
        </div>
        <div class="sp-prog"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
