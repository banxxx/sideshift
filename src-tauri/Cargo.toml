[package]
name = "sideshift"
# 版本号唯一真源在根目录 package.json（tauri.conf.json 与前端构建注入都读它）。
# 这里跟着同步只为让 CARGO_PKG_VERSION 不说假话，实际外显取自 app.package_info()。
version = "1.0.0-beta.1"
description = "SideShift: Minecraft 模组包转换工具"
authors = ["banxxx"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sideshift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
sha1 = "0.10"
# Mojang 的贴图属性是 base64 的 JSON（值在 payload 里，不给明文）⇒ 皮肤那条链要解一次。
# 锁 0.22：与依赖树里已有的那一份同版本，不因此多编一份 crate
base64 = { version = "0.22", default-features = false, features = ["std"] }
# 检查更新要比 `1.0.0-beta.2` 与 `1.0.0` 谁新，字符串比较判不出（0.10.0 字面比 0.9.0 小）
semver = "1"

# 数据根预选要读每个盘的剩余空间（GetDiskFreeSpaceExW）；锁在 windows 目标里，
# 其他平台编译不到这行，data_root 那边直接返回空候选、回落用户目录
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
